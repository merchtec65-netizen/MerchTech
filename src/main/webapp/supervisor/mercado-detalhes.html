<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mercado - Detalhes</title>

<style>

body{
  background:#1a2540;
  color:white;
  font-family:Arial;
  max-width:1100px;
  margin:auto;
  padding:30px;
}

.card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:20px;
  margin-bottom:24px;
}

.galeria{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

.foto-card{
  background:rgba(255,255,255,.05);
  border-radius:16px;
  overflow:hidden;
}

.foto-card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.info{
  padding:16px;
}

.produto{
  font-weight:bold;
}

.empresa{
  color:#5285e8;
  margin-top:4px;
}

.meta{
  margin-top:6px;
  color:#aaa;
  font-size:13px;
}

</style>
</head>

<body>

<div class="card">
  <h2 id="mercado-nome">Carregando...</h2>
  <p id="mercado-info"></p>
</div>

<div class="card">
  <h3>Registros do Mercado</h3>
</div>

<div class="galeria" id="galeria"></div>

<script>

const params = new URLSearchParams(window.location.search);
const mercadoId = params.get('id');

async function carregarMercado(){

  const resp = await fetch('/MerchTech/mercados');
  const lista = await resp.json();

  const mercado = lista.find(m => m.id == mercadoId);

  if(!mercado) return;

  document.getElementById('mercado-nome').textContent = mercado.nome;
  document.getElementById('mercado-info').textContent =
    `${mercado.cidade} - ${mercado.bairro} | ${mercado.rua}, ${mercado.numero}`;
}

async function carregarRegistros(){

  const resp = await fetch(`/MerchTech/registros?mercado=${mercadoId}`);
  const lista = await resp.json();

  const galeria = document.getElementById('galeria');

  if(!lista.length){
    galeria.innerHTML = "<p>Nenhum registro encontrado.</p>";
    return;
  }

  galeria.innerHTML = lista.map(r => `
    <div class="foto-card">

      <img src="/MerchTech/uploads/${r.foto}">

      <div class="info">
        <div class="produto">${r.produto}</div>
        <div class="empresa">${r.empresa}</div>
        <div class="meta">${r.nomeUsuario || ''}</div>
        <div class="meta">${r.criado_em || ''}</div>
        <div class="meta">${r.hora || ''}</div>
      </div>

    </div>
  `).join('');
}

carregarMercado();
carregarRegistros();

</script>

</body>
</html>
