<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MerchTech — Mercados (Supervisor)</title>
<link rel="icon" href="../foto/ICONENOVO.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap');

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root{
  --navy:#1a2540;
  --blue:#3b6fd4;
  --blue2:#5285e8;
  --border:rgba(255,255,255,0.09);
  --card:rgba(255,255,255,0.04);
  --muted:#8892aa;
  --silver:#c8cfe0;
  --error:#e05555;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--navy);
  color:#e8ecf4;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 10% 90%, rgba(59,111,212,0.18), transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 10%, rgba(82,133,232,0.14), transparent 55%);
  z-index:0;
}

.layout{
  display:flex;
  height:100vh;
  position:relative;
  z-index:1;
}

/* ── Sidebar ── */
.sidebar{
  width:220px;
  background:rgba(15,20,38,0.85);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:24px 0;
  flex-shrink:0;
  backdrop-filter:blur(8px);
}

.sidebar-brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 20px 24px;
  border-bottom:1px solid var(--border);
  margin-bottom:16px;
}

.brand-dot{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(135deg, var(--blue2), var(--blue));
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

.brand-dot svg{ width:17px; height:17px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

.brand-name{ font-family:'Syne',sans-serif; font-size:15px; font-weight:800; color:#fff; }
.brand-role{ font-size:11px; color:var(--muted); }

.nav-section{ padding:0 12px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  border-radius:10px; cursor:pointer; font-size:13px; font-weight:500;
  color:var(--muted); transition:background 0.15s, color 0.15s;
  border:none; background:transparent; width:100%; text-align:left; margin-bottom:2px;
}
.nav-item svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.nav-item:hover{ background:var(--card); color:var(--silver); }
.nav-item.active{ background:rgba(82,133,232,0.15); color:var(--blue2); }

.sidebar-spacer{ flex:1; }
.sidebar-user{
  padding:16px 20px 0;
  border-top:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
}
.avatar{
  width:34px; height:34px; border-radius:50%;
  background:linear-gradient(135deg, var(--blue2), var(--blue));
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:600; color:#fff; flex-shrink:0;
}
.user-name{ font-size:13px; font-weight:500; color:var(--silver); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-role{ font-size:11px; color:var(--muted); }
.btn-logout{ background:none; border:none; cursor:pointer; color:var(--muted); padding:4px; display:flex; align-items:center; transition:color 0.15s; }
.btn-logout:hover{ color:var(--error); }
.btn-logout svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* ── Main ── */
.main{
  flex:1; overflow-y:auto; padding:32px 36px;
  display:flex; flex-direction:column; gap:24px;
  scrollbar-width:thin; scrollbar-color:rgba(82,133,232,0.5) transparent;
}
.main::-webkit-scrollbar{ width:6px; }
.main::-webkit-scrollbar-thumb{ background:rgba(82,133,232,0.4); border-radius:20px; }

.page-header{ display:flex; align-items:center; justify-content:space-between; gap:16px; }

.page-title{ font-family:'Syne',sans-serif; font-size:26px; font-weight:800; }
.page-sub{ font-size:13px; color:var(--muted); margin-top:4px; }

/* Botão Adicionar */
.btn-add{
  display:flex; align-items:center; gap:8px;
  height:42px; padding:0 20px; border:none; border-radius:12px;
  background:linear-gradient(135deg, var(--blue2), var(--blue));
  color:#fff; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600;
  cursor:pointer; transition:opacity 0.2s; box-shadow:0 4px 16px rgba(59,111,212,0.3);
  flex-shrink:0;
}
.btn-add:hover{ opacity:0.9; }
.btn-add svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; }

/* ── Grid de mercados ── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:16px;
}

.card{
  display:flex;
  gap:14px;
  padding:14px;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:14px;
  transition:border-color 0.2s, transform 0.2s;
  cursor:pointer;
  animation:fadeUp 0.35s ease both;
}

.card:hover{
  border-color:rgba(82,133,232,0.4);
  transform:translateY(-2px);
}

.card img{
  width:90px; height:90px;
  border-radius:12px;
  object-fit:cover;
  background:#1f2a44;
  flex-shrink:0;
}

.card-info{ flex:1; min-width:0; }
.card-info h3{ font-size:14px; font-weight:600; color:var(--silver); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-info p{ font-size:12px; color:var(--muted); margin-top:4px; }

.card-actions{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:space-between;
  gap:8px;
  flex-shrink:0;
}

.btn-remove{
  background:rgba(224,85,85,0.12);
  border:1px solid rgba(224,85,85,0.25);
  color:#e05555;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:11px;
  font-weight:600;
  transition:background 0.15s, border-color 0.15s;
  white-space:nowrap;
}
.btn-remove:hover{ background:rgba(224,85,85,0.22); border-color:rgba(224,85,85,0.45); }

/* Badge contador de registros */
.badge-registros{
  font-size:11px;
  color:var(--blue2);
  background:rgba(82,133,232,0.12);
  border:1px solid rgba(82,133,232,0.2);
  border-radius:6px;
  padding:3px 8px;
  font-weight:500;
  white-space:nowrap;
}

/* ── Modal Novo Mercado ── */
.overlay{
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.65); backdrop-filter:blur(5px);
  z-index:100; align-items:center; justify-content:center;
}
.overlay.open{ display:flex; }

.modal{
  background:#1e2a45; border:1px solid var(--border);
  border-radius:20px; width:440px; padding:32px;
  animation:popIn 0.2s ease both;
}

.modal-title{ font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:#fff; margin-bottom:4px; }
.modal-sub{ font-size:13px; color:var(--muted); margin-bottom:24px; }

.form-grid{ display:grid; gap:14px; }
.form-field label{
  display:block; font-size:11px; font-weight:600; letter-spacing:0.7px;
  text-transform:uppercase; color:var(--muted); margin-bottom:6px;
}
.form-field input[type="text"],
.form-field input[type="file"]{
  width:100%; height:44px;
  background:rgba(255,255,255,0.06); border:1px solid var(--border);
  border-radius:10px; padding:0 14px;
  font-family:'DM Sans',sans-serif; font-size:14px; color:#fff;
  outline:none; transition:border-color 0.2s, background 0.2s;
}
.form-field input[type="text"]::placeholder{ color:rgba(255,255,255,0.2); }
.form-field input[type="text"]:focus{ border-color:var(--blue2); background:rgba(82,133,232,0.08); }
.form-field input[type="file"]{ padding:10px 14px; cursor:pointer; }

.modal-footer{ display:flex; gap:12px; margin-top:24px; }
.btn-primary{
  flex:1; height:46px; border:none; border-radius:10px;
  background:linear-gradient(135deg, var(--blue2), var(--blue));
  color:#fff; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600;
  cursor:pointer; transition:opacity 0.2s;
}
.btn-primary:hover{ opacity:0.9; }
.btn-secondary{
  height:46px; padding:0 20px; border:1px solid var(--border); border-radius:10px;
  background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif;
  font-size:14px; cursor:pointer; transition:background 0.15s, color 0.15s;
}
.btn-secondary:hover{ background:var(--card); color:var(--silver); }

.empty-msg{ color:var(--muted); font-size:13px; }

@keyframes fadeUp{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }
@keyframes popIn{ from{ opacity:0; transform:scale(0.95); } to{ opacity:1; transform:scale(1); } }
</style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-dot">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div>
        <div class="brand-name">MerchTech</div>
        <div class="brand-role">Supervisor</div>
      </div>
    </div>

    <div class="nav-section">
      <button class="nav-item" onclick="window.location.href='supervisor.html'">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Painel
      </button>
      <button class="nav-item active" onclick="window.location.href='mercados.html'">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Mercados
      </button>
    </div>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-user">
      <div class="avatar" id="avatar-initials">SV</div>
      <div style="flex:1;min-width:0">
        <div class="user-name" id="user-display">Supervisor</div>
        <div class="user-role">Supervisor</div>
      </div>
      <button class="btn-logout" onclick="sair()" title="Sair">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">

    <div class="page-header">
      <div>
        <div class="page-title">Mercados</div>
        <div class="page-sub">Gerencie e visualize os pontos de entrega</div>
      </div>
      <button class="btn-add" onclick="abrirModal()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Novo Mercado
      </button>
    </div>

    <div class="grid" id="grid">
      <div class="empty-msg">Carregando...</div>
    </div>

  </main>
</div>

<!-- Modal: Novo Mercado -->
<div class="overlay" id="modal-overlay" onclick="fecharModalFora(event)">
  <div class="modal">
    <div class="modal-title">Novo Mercado</div>
    <div class="modal-sub">Preencha os dados do ponto de entrega.</div>

    <div class="form-grid">
      <div class="form-field">
        <label>Nome do mercado</label>
        <input type="text" id="nome" placeholder="ex: Supermercado Central">
      </div>
      <div class="form-field">
        <label>Cidade</label>
        <input type="text" id="cidade" placeholder="ex: São Paulo">
      </div>
      <div class="form-field">
        <label>Bairro</label>
        <input type="text" id="bairro" placeholder="ex: Centro">
      </div>
      <div class="form-field">
        <label>Rua</label>
        <input type="text" id="rua" placeholder="ex: Av. Paulista">
      </div>
      <div class="form-field">
        <label>Número</label>
        <input type="text" id="numero" placeholder="ex: 1000">
      </div>
      <div class="form-field">
        <label>Foto do mercado</label>
        <input type="file" id="foto" accept="image/*">
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn-primary" onclick="cadastrarMercado()">Salvar Mercado</button>
    </div>
  </div>
</div>

<script>
  // Exibir nome do supervisor
  const usuarioStr = sessionStorage.getItem('usuario');
  if (usuarioStr) {
    const usuario = JSON.parse(usuarioStr);
    document.getElementById('user-display').textContent = usuario.nome || 'Supervisor';
    const iniciais = (usuario.nome || 'SV').split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);
    document.getElementById('avatar-initials').textContent = iniciais;
  }

  async function carregar() {
    const grid = document.getElementById('grid');
    try {
      const resp  = await fetch('/MerchTech/mercados');
      const lista = await resp.json();

      if (!lista.length) {
        grid.innerHTML = `<div class="empty-msg">Nenhum mercado cadastrado.</div>`;
        return;
      }

      grid.innerHTML = lista.map((m, i) => `
        <div class="card" style="animation-delay:${i * 0.05}s" onclick="abrirMercado(${m.id})">
          <img src="/MerchTech/uploads/${m.foto || 'semfoto.png'}"
               onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 1 1\'><rect width=\'1\' height=\'1\' fill=\'%231f2a44\'/></svg>'">
          <div class="card-info">
            <h3>${m.nome}</h3>
            <p>${m.cidade || ''}</p>
            <p>${m.bairro || ''}</p>
            <p>${[m.rua, m.numero].filter(Boolean).join(', ')}</p>
          </div>
          <div class="card-actions">
            <span class="badge-registros">Ver registros</span>
            <button class="btn-remove" onclick="removerMercado(event, ${m.id})">Remover</button>
          </div>
        </div>
      `).join('');

    } catch(e) {
      grid.innerHTML = `<div class="empty-msg">Erro ao carregar mercados.</div>`;
    }
  }

  function abrirMercado(id) {
    window.location.href = `mercado-detalhes.html?id=${id}`;
  }

  async function removerMercado(event, id) {
    event.stopPropagation();
    if (!confirm('Deseja remover este mercado?')) return;
    try {
      const resp = await fetch('/MerchTech/mercados?id=' + id, { method: 'DELETE' });
      if (!resp.ok) throw new Error();
      carregar();
    } catch(e) {
      alert('Erro ao remover mercado');
    }
  }

  async function cadastrarMercado() {
    const formData = new FormData();
    formData.append('nome',   document.getElementById('nome').value);
    formData.append('cidade', document.getElementById('cidade').value);
    formData.append('bairro', document.getElementById('bairro').value);
    formData.append('rua',    document.getElementById('rua').value);
    formData.append('numero', document.getElementById('numero').value);
    const foto = document.getElementById('foto').files[0];
    if (foto) formData.append('foto', foto);

    try {
      const resp = await fetch('/MerchTech/mercados', { method: 'POST', body: formData });
      if (!resp.ok) throw new Error();
      fecharModal();
      carregar();
    } catch(e) {
      alert('Erro ao cadastrar mercado');
    }
  }

  function abrirModal() {
    document.getElementById('modal-overlay').classList.add('open');
  }
  function fecharModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    ['nome','cidade','bairro','rua','numero'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('foto').value = '';
  }
  function fecharModalFora(e) {
    if (e.target === document.getElementById('modal-overlay')) fecharModal();
  }

  function sair() {
    sessionStorage.removeItem('usuario');
    window.location.href = '../index.html';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

  carregar();
</script>
</body>
</html>
