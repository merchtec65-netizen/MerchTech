<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MerchTech — Detalhes do Mercado</title>
<link rel="icon" href="../IMAGEM/ICONENOVO.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --navy:   #1a2540;
  --blue:   #3b6fd4;
  --blue2:  #5285e8;
  --border: rgba(255,255,255,0.09);
  --card:   rgba(255,255,255,0.04);
  --muted:  #8892aa;
  --silver: #c8cfe0;
  --success: #34c47c;
  --error:   #e05555;
}

html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--navy); color: #e8ecf4; }

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 10% 90%, rgba(59,111,212,0.18), transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 10%, rgba(82,133,232,0.14), transparent 55%);
  z-index: 0;
}

.layout { display: flex; height: 100vh; position: relative; z-index: 1; }

/* ── Sidebar ── */
.sidebar {
  width: 220px; background: rgba(15,20,38,0.85);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 24px 0;
  flex-shrink: 0; backdrop-filter: blur(8px);
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 0 20px 24px; border-bottom: 1px solid var(--border); margin-bottom: 16px;
}
.brand-dot {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.brand-dot svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.brand-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; color: #fff; }
.brand-role { font-size: 11px; color: var(--muted); }

.nav-section { padding: 0 12px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--muted); transition: background 0.15s, color 0.15s;
  border: none; background: transparent; width: 100%; text-align: left; margin-bottom: 2px;
}
.nav-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.nav-item:hover { background: var(--card); color: var(--silver); }
.nav-item.active { background: rgba(82,133,232,0.15); color: var(--blue2); }

.sidebar-spacer { flex: 1; }
.sidebar-user {
  padding: 16px 20px 0; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: #fff; flex-shrink: 0;
}
.user-name { font-size: 13px; font-weight: 500; color: var(--silver); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 11px; color: var(--muted); }
.btn-logout { background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; display: flex; align-items: center; transition: color 0.15s; }
.btn-logout:hover { color: var(--error); }
.btn-logout svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── Main ── */
.main {
  flex: 1; overflow-y: auto; padding: 32px 36px;
  display: flex; flex-direction: column; gap: 24px;
  scrollbar-width: thin; scrollbar-color: rgba(82,133,232,0.5) transparent;
}
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-thumb { background: rgba(82,133,232,0.4); border-radius: 20px; }

/* ── Header do mercado ── */
.mercado-header {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px 28px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.mercado-header-info { flex: 1; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--muted); cursor: pointer;
  background: none; border: none; margin-bottom: 10px;
  transition: color 0.15s; padding: 0;
}
.back-btn:hover { color: var(--blue2); }
.back-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mercado-nome-header { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 6px; }
.mercado-end-header { font-size: 13px; color: var(--muted); }

.btn-registrar {
  display: flex; align-items: center; gap: 8px;
  height: 42px; padding: 0 20px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  color: #fff; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s; box-shadow: 0 4px 16px rgba(59,111,212,0.3);
  flex-shrink: 0;
}
.btn-registrar:hover { opacity: 0.9; }
.btn-registrar svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }

/* ── Galeria ── */
.section-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.section-head { padding: 20px 24px; border-bottom: 1px solid var(--border); }
.section-title { font-size: 14px; font-weight: 600; color: var(--silver); }
.section-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding: 20px 24px; }

.foto-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden;
  transition: border-color 0.2s, transform 0.2s;
  animation: fadeUp 0.4s ease both;
}
.foto-card:hover { border-color: rgba(82,133,232,0.35); transform: translateY(-2px); }

.foto-card img { width: 100%; height: 180px; object-fit: cover; display: block; background: rgba(82,133,232,0.06); }

.foto-info { padding: 14px 16px; }
.foto-produto { font-size: 14px; font-weight: 600; color: var(--silver); margin-bottom: 3px; }
.foto-empresa { font-size: 12px; color: var(--blue2); margin-bottom: 8px; font-weight: 500; }
.foto-meta { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); margin-top: 3px; }
.foto-meta svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }

.empty-state { padding: 48px 24px; text-align: center; font-size: 13px; color: var(--muted); grid-column: 1/-1; }
.empty-state svg { width: 36px; height: 36px; stroke: var(--muted); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; margin: 0 auto 12px; opacity: 0.4; }

/* ── Modal de registro ── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(5px);
  z-index: 100; align-items: center; justify-content: center;
}
.overlay.open { display: flex; }

.modal {
  background: #1e2a45; border: 1px solid var(--border);
  border-radius: 20px; width: 440px; padding: 32px;
  animation: popIn 0.2s ease both;
}
.modal-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

.form-grid { display: grid; gap: 14px; }
.form-field label {
  display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.7px;
  text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
}
.form-field input[type="text"] {
  width: 100%; height: 44px;
  background: rgba(255,255,255,0.06); border: 1px solid var(--border);
  border-radius: 10px; padding: 0 14px;
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: #fff;
  outline: none; transition: border-color 0.2s, background 0.2s;
}
.form-field input[type="text"]::placeholder { color: rgba(255,255,255,0.2); }
.form-field input[type="text"]:focus { border-color: var(--blue2); background: rgba(82,133,232,0.08); }

/* Upload area */
.upload-area {
  border: 2px dashed var(--border); border-radius: 12px;
  padding: 24px; text-align: center; cursor: pointer;
  transition: border-color 0.2s, background 0.2s; position: relative;
}
.upload-area:hover { border-color: rgba(82,133,232,0.5); background: rgba(82,133,232,0.04); }
.upload-area.has-file { border-color: rgba(52,196,124,0.4); background: rgba(52,196,124,0.04); }
.upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-area svg { width: 24px; height: 24px; stroke: var(--muted); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; margin: 0 auto 8px; }
.upload-label { font-size: 13px; color: var(--muted); }
.upload-label strong { color: var(--blue2); }
.upload-preview { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; display: none; margin-top: 12px; }

/* Hora display */
.hora-display {
  height: 44px; background: rgba(255,255,255,0.03);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 0 14px; display: flex; align-items: center; gap: 8px;
  font-size: 14px; color: var(--silver);
}
.hora-display svg { width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }

.modal-error { display: none; font-size: 12px; color: var(--error); background: rgba(224,85,85,0.1); border: 1px solid rgba(224,85,85,0.25); border-radius: 8px; padding: 10px 14px; margin-top: 4px; }
.modal-error.show { display: block; }

.modal-footer { display: flex; gap: 12px; margin-top: 24px; }
.btn-primary {
  flex: 1; height: 46px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary:hover { opacity: 0.9; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary {
  height: 46px; padding: 0 20px; border: 1px solid var(--border); border-radius: 10px;
  background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif;
  font-size: 14px; cursor: pointer; transition: background 0.15s, color 0.15s;
}
.btn-secondary:hover { background: var(--card); color: var(--silver); }

.spinner {
  display: none; width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
  border-radius: 50%; animation: spin 0.7s linear infinite;
}

/* Toast */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1e2a45; border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 20px; font-size: 13px; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4); opacity: 0;
  transition: opacity 0.3s, transform 0.3s; z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: rgba(52,196,124,0.4); }
.toast.error   { border-color: rgba(224,85,85,0.4); }
.toast-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.toast.success .toast-icon { color: var(--success); }
.toast.error   .toast-icon { color: var(--error); }

@keyframes fadeUp  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes popIn   { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes spin    { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-dot">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div>
        <div class="brand-name">MerchTech</div>
        <div class="brand-role">Promotor</div>
      </div>
    </div>
    <div class="nav-section">
      <button class="nav-item" onclick="window.location.href='promotor.html'">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Painel
      </button>
      <button class="nav-item active" onclick="window.location.href='mercados.html'">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Mercados
      </button>
    </div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-user">
      <div class="avatar" id="avatar-initials">PR</div>
      <div style="flex:1;min-width:0">
        <div class="user-name" id="user-display">Promotor</div>
        <div class="user-role">Promotor</div>
      </div>
      <button class="btn-logout" onclick="sair()" title="Sair">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">

    <!-- Header do mercado -->
    <div class="mercado-header">
      <div class="mercado-header-info">
        <button class="back-btn" onclick="window.location.href='mercados.html'">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Voltar para mercados
        </button>
        <div class="mercado-nome-header" id="mercado-nome">Carregando...</div>
        <div class="mercado-end-header" id="mercado-info"></div>
      </div>
      <button class="btn-registrar" onclick="abrirModal()">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Registrar foto
      </button>
    </div>

    <!-- Galeria de registros -->
    <div class="section-card">
      <div class="section-head">
        <div class="section-title">Registros do dia</div>
        <div class="section-sub">Fotos e informações de produtos registrados</div>
      </div>
      <div class="galeria" id="galeria">
        <div class="empty-state">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Carregando registros...
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Modal: Registrar foto -->
<div class="overlay" id="modal-overlay" onclick="fecharModalFora(event)">
  <div class="modal">
    <div class="modal-title">Registrar foto</div>
    <div class="modal-sub">Documente o produto no ponto de venda.</div>

    <div class="form-grid">
      <div class="form-field">
        <label>Empresa / Marca</label>
        <input type="text" id="f-empresa" placeholder="ex: Coca-Cola">
      </div>
      <div class="form-field">
        <label>Produto</label>
        <input type="text" id="f-produto" placeholder="ex: Coca-Cola 2L">
      </div>
      <div class="form-field">
        <label>Horário</label>
        <div class="hora-display">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="hora-atual">--:--:--</span>
        </div>
      </div>
      <div class="form-field">
        <label>Foto</label>
        <div class="upload-area" id="upload-area">
          <input type="file" id="f-foto" accept="image/*" onchange="previsualizarFoto(this)">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <div class="upload-label"><strong>Clique</strong> ou arraste a foto aqui</div>
          <img class="upload-preview" id="upload-preview" src="" alt="">
        </div>
      </div>
    </div>

    <div class="modal-error" id="modal-error-msg"></div>

    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn-primary" id="btn-salvar" onclick="enviarRegistro()">
        <div class="spinner" id="form-spinner"></div>
        <span id="btn-salvar-text">Enviar</span>
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span class="toast-icon"><svg id="toast-icon-svg" viewBox="0 0 24 24"></svg></span>
  <span id="toast-msg"></span>
</div>

<script>
  const usuarioStr = sessionStorage.getItem('usuario');
  if (!usuarioStr) { window.location.href = '../index.html'; }
  const usuario = JSON.parse(usuarioStr || '{}');

  document.getElementById('user-display').textContent = usuario.nome || 'Promotor';
  const iniciais = (usuario.nome || 'PR').split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);
  document.getElementById('avatar-initials').textContent = iniciais;

  const params    = new URLSearchParams(window.location.search);
  const mercadoId = params.get('id');

  if (!mercadoId) window.location.href = 'mercados.html';

  // Relógio ao vivo no modal
  function atualizarHora() {
    document.getElementById('hora-atual').textContent =
      new Date().toLocaleTimeString('pt-BR');
  }
  setInterval(atualizarHora, 1000);
  atualizarHora();

  // Carregar dados do mercado
  async function carregarMercado() {
    try {
      const resp  = await fetch('/MerchTech/mercados');
      const lista = await resp.json();
      const m     = lista.find(x => x.id == mercadoId);
      if (!m) return;
      document.getElementById('mercado-nome').textContent = m.nome;
      document.getElementById('mercado-info').textContent =
        [m.rua, m.numero, m.bairro, m.cidade].filter(Boolean).join(' · ');
      document.title = `MerchTech — ${m.nome}`;
    } catch(e) {}
  }

  // Carregar registros
  async function carregarRegistros() {
    const galeria = document.getElementById('galeria');
    try {
      const resp  = await fetch(`/MerchTech/registros?mercado=${mercadoId}`);
      const lista = await resp.json();

      if (!lista.length) {
        galeria.innerHTML = `<div class="empty-state">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Nenhum registro ainda. Seja o primeiro a registrar!
        </div>`;
        return;
      }

      galeria.innerHTML = lista.map((r, i) => `
        <div class="foto-card" style="animation-delay:${i * 0.05}s">
          <img src="/MerchTech/uploads/${r.foto}" alt="${r.produto}"
               onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 1 1\'></svg>'">
          <div class="foto-info">
            <div class="foto-produto">${r.produto}</div>
            <div class="foto-empresa">${r.empresa}</div>
            <div class="foto-meta">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              ${r.nomeUsuario || ''}
            </div>
            <div class="foto-meta">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              ${r.criado_emStr || ''}
            </div>
            <div class="foto-meta">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              ${r.hora ? r.hora.slice(0, 5) : ''}
            </div>
          </div>
        </div>
      `).join('');

    } catch(e) {
      galeria.innerHTML = `<div class="empty-state">Erro ao carregar registros.</div>`;
    }
  }

  // Preview da foto
  function previsualizarFoto(input) {
    const area    = document.getElementById('upload-area');
    const preview = document.getElementById('upload-preview');
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = e => {
        preview.src     = e.target.result;
        preview.style.display = 'block';
        area.classList.add('has-file');
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  // Modal
  function abrirModal() {
    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('f-empresa').focus();
  }
  function fecharModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('f-empresa').value = '';
    document.getElementById('f-produto').value = '';
    document.getElementById('f-foto').value    = '';
    document.getElementById('upload-preview').style.display = 'none';
    document.getElementById('upload-area').classList.remove('has-file');
    document.getElementById('modal-error-msg').classList.remove('show');
  }
  function fecharModalFora(e) {
    if (e.target === document.getElementById('modal-overlay')) fecharModal();
  }

  // Enviar registro
  async function enviarRegistro() {
    const empresa = document.getElementById('f-empresa').value.trim();
    const produto = document.getElementById('f-produto').value.trim();
    const fotoEl  = document.getElementById('f-foto');
    const errEl   = document.getElementById('modal-error-msg');

    if (!empresa || !produto) {
      errEl.textContent = 'Preencha empresa e produto.';
      errEl.classList.add('show');
      return;
    }
    if (!fotoEl.files[0]) {
      errEl.textContent = 'Selecione uma foto.';
      errEl.classList.add('show');
      return;
    }

    errEl.classList.remove('show');
    const btn = document.getElementById('btn-salvar');
    document.getElementById('form-spinner').style.display = 'block';
    document.getElementById('btn-salvar-text').style.display = 'none';
    btn.disabled = true;

    try {
      const formData = new FormData();
      formData.append('mercado_id', mercadoId);
      formData.append('usuario_id', usuario.id);
      formData.append('empresa',    empresa);
      formData.append('produto',    produto);
      formData.append('foto',       fotoEl.files[0]);

      const resp = await fetch('/MerchTech/registrar-visita', {
        method: 'POST',
        body:   formData
      });

      if (!resp.ok) throw new Error('Erro ao enviar');

      fecharModal();
      mostrarToast('Foto registrada com sucesso!', 'success');
      carregarRegistros();

    } catch(e) {
      errEl.textContent = e.message || 'Erro ao enviar. Tente novamente.';
      errEl.classList.add('show');
    } finally {
      document.getElementById('form-spinner').style.display = 'none';
      document.getElementById('btn-salvar-text').style.display = 'block';
      btn.disabled = false;
    }
  }

  function mostrarToast(msg, tipo = 'success') {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    const icons = {
      success: '<polyline points="20 6 9 17 4 12"/>',
      error:   '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
    };
    document.getElementById('toast-icon-svg').innerHTML = icons[tipo] || icons.success;
    toast.className = `toast ${tipo}`;
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => toast.classList.remove('show'), 3500);
  }

  function sair() {
    sessionStorage.removeItem('usuario');
    window.location.href = '../index.html';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

  carregarMercado();
  carregarRegistros();
</script>
</body>
