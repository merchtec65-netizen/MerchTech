<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MerchTech — Mercados</title>
<link rel="icon" href="../IMAGEM/ICONENOVO.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#1a2540;--blue:#3b6fd4;--blue2:#5285e8;--border:rgba(255,255,255,0.09);--card:rgba(255,255,255,0.04);--muted:#8892aa;--silver:#c8cfe0;--error:#e05555;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--navy);color:#e8ecf4;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 10% 90%,rgba(59,111,212,0.18),transparent 60%),radial-gradient(ellipse 50% 40% at 90% 10%,rgba(82,133,232,0.14),transparent 55%);z-index:0;}
.layout{display:flex;height:100vh;position:relative;z-index:1;}

/* Sidebar */
.sidebar{width:220px;background:rgba(15,20,38,0.85);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;flex-shrink:0;backdrop-filter:blur(8px);}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.brand-dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue2),var(--blue));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-dot svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.brand-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#fff;}
.brand-role{font-size:11px;color:var(--muted);}
.nav-section{padding:0 12px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:background .15s,color .15s;border:none;background:transparent;width:100%;text-align:left;margin-bottom:2px;}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.nav-item:hover{background:var(--card);color:var(--silver);}
.nav-item.active{background:rgba(82,133,232,0.15);color:var(--blue2);}
.sidebar-spacer{flex:1;}
.sidebar-user{padding:16px 20px 0;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue2),var(--blue));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex-shrink:0;}
.user-name{font-size:13px;font-weight:500;color:var(--silver);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:11px;color:var(--muted);}
.btn-logout{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;display:flex;align-items:center;transition:color .15s;}
.btn-logout:hover{color:var(--error);}
.btn-logout svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* Topbar mobile */
.topbar{display:none;align-items:center;justify-content:space-between;padding:0 16px;height:56px;background:rgba(15,20,38,0.92);border-bottom:1px solid var(--border);backdrop-filter:blur(8px);position:sticky;top:0;z-index:50;flex-shrink:0;}
.topbar-brand{display:flex;align-items:center;gap:8px;}
.topbar-brand .brand-dot{width:28px;height:28px;border-radius:8px;}
.topbar-brand .brand-dot svg{width:14px;height:14px;}
.topbar-brand .brand-name{font-size:14px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-right .avatar{width:28px;height:28px;font-size:11px;}

/* Bottom nav */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(15,20,38,0.96);border-top:1px solid var(--border);backdrop-filter:blur(12px);z-index:50;}
.bottom-nav-inner{display:flex;height:100%;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;transition:color .15s;-webkit-tap-highlight-color:transparent;}
.bnav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.bnav-item.active{color:var(--blue2);}

/* Main */
.main{flex:1;overflow-y:auto;padding:32px 36px;display:flex;flex-direction:column;gap:24px;scrollbar-width:thin;scrollbar-color:rgba(82,133,232,0.5) transparent;}
.main::-webkit-scrollbar{width:6px;}
.main::-webkit-scrollbar-thumb{background:rgba(82,133,232,0.4);border-radius:20px;}
.page-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#fff;letter-spacing:-.5px;}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px;}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.mercado-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;animation:fadeUp .4s ease both;-webkit-tap-highlight-color:transparent;}
.mercado-card:hover,.mercado-card:active{border-color:rgba(82,133,232,0.45);transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,0.2);}
.mercado-thumb{width:100%;height:160px;background:rgba(82,133,232,0.08);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mercado-thumb svg{width:40px;height:40px;stroke:rgba(82,133,232,0.3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.mercado-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.mercado-body{padding:16px 18px;}
.mercado-nome{font-size:14px;font-weight:600;color:var(--silver);margin-bottom:6px;}
.mercado-end{font-size:12px;color:var(--muted);line-height:1.5;}
.mercado-footer{padding:10px 18px 14px;display:flex;align-items:center;gap:6px;}
.mercado-badge{font-size:11px;font-weight:600;letter-spacing:.4px;padding:3px 10px;border-radius:20px;background:rgba(52,196,124,0.15);color:#34c47c;display:inline-flex;align-items:center;gap:4px;}
.mercado-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
.empty-state{grid-column:1/-1;padding:60px 24px;text-align:center;color:var(--muted);}
.empty-state svg{width:40px;height:40px;stroke:var(--muted);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 14px;opacity:.5;}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* Mobile */
@media(max-width:900px){
  .sidebar{display:none!important;}
  .topbar{display:flex;}
  .bottom-nav{display:block;}
  .layout{flex-direction:column;height:auto;min-height:100vh;}
  .main{padding:16px 16px 80px;gap:16px;}
  .page-title{font-size:20px;}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .mercado-thumb{height:110px;}
  .mercado-body{padding:10px 12px;}
  .mercado-nome{font-size:13px;}
  .mercado-footer{padding:6px 12px 12px;}
}
@media(max-width:360px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="layout">

  <!-- Sidebar desktop -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-dot"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <div><div class="brand-name">MerchTech</div><div class="brand-role">Promotor</div></div>
    </div>
    <div class="nav-section">
      <button class="nav-item" onclick="window.location.href='promotor.html'">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Painel
      </button>
      <button class="nav-item active" onclick="window.location.href='mercados.html'">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Mercados
      </button>
    </div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-user">
      <div class="avatar" id="avatar-d">PR</div>
      <div style="flex:1;min-width:0"><div class="user-name" id="name-d">Promotor</div><div class="user-role">Promotor</div></div>
      <button class="btn-logout" onclick="sair()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </aside>

  <!-- Topbar mobile -->
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-dot"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <span class="brand-name">MerchTech</span>
    </div>
    <div class="topbar-right">
      <div class="avatar" id="avatar-m">PR</div>
      <button class="btn-logout" onclick="sair()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </header>

  <main class="main">
    <div><div class="page-title">Mercados</div><div class="page-sub">Pontos de venda disponíveis para visita</div></div>
    <div class="grid" id="grid">
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Carregando mercados...
      </div>
    </div>
  </main>

  <!-- Bottom nav mobile -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="bnav-item" onclick="window.location.href='promotor.html'">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Painel
      </button>
      <button class="bnav-item active" onclick="window.location.href='mercados.html'">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Mercados
      </button>
    </div>
  </nav>
</div>

<script>
  const usuarioStr = sessionStorage.getItem('usuario');
  if (!usuarioStr) { window.location.href = '../index.html'; }
  const usuario = JSON.parse(usuarioStr || '{}');

  const nome = usuario.nome || 'Promotor';
  const iniciais = nome.split(' ').map(p=>p[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('name-d').textContent = nome;
  ['avatar-d','avatar-m'].forEach(id => document.getElementById(id).textContent = iniciais);

  async function carregar() {
    const grid = document.getElementById('grid');
    try {
      const resp  = await fetch('/MerchTech/mercados');
      const lista = await resp.json();
      const ativos = lista.filter(m => m.ativo !== false);

      if (!ativos.length) {
        grid.innerHTML = `<div class="empty-state">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Nenhum mercado cadastrado.
        </div>`;
        return;
      }

      grid.innerHTML = ativos.map((m, i) => `
        <div class="mercado-card" onclick="abrirMercado(${m.id})" style="animation-delay:${i*0.05}s">
          <div class="mercado-thumb">
            ${m.foto
              ? `<img src="/MerchTech/uploads/${m.foto}" alt="${m.nome}" onerror="this.parentElement.innerHTML='<svg viewBox=\'0 0 24 24\'><path d=\'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z\'/><polyline points=\'9 22 9 12 15 12 15 22\'/></svg>'">`
              : `<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`
            }
          </div>
          <div class="mercado-body">
            <div class="mercado-nome">${m.nome}</div>
            <div class="mercado-end">${[m.rua,m.numero].filter(Boolean).join(', ')}<br>${[m.bairro,m.cidade].filter(Boolean).join(' — ')}</div>
          </div>
          <div class="mercado-footer"><span class="mercado-badge">Ativo</span></div>
        </div>`).join('');

    } catch(e) {
      grid.innerHTML = `<div class="empty-state">Erro ao carregar mercados.</div>`;
    }
  }

  function abrirMercado(id) { window.location.href = `mercado-detalhes.html?id=${id}`; }
  function sair() { sessionStorage.removeItem('usuario'); window.location.href = '../index.html'; }

  carregar();
</script>
</body>
</html>
