<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MerchTech — Acesso</title>
<link rel="icon" href="foto/ICONENOVO.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2540;--navy2:#243050;--blue:#3b6fd4;--blue2:#5285e8;--silver:#c8cfe0;--muted:#8892aa;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.10);--error:#e05555;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--navy);color:#fff;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 15% 80%,rgba(59,111,212,0.22),transparent 60%),radial-gradient(ellipse 60% 50% at 85% 20%,rgba(82,133,232,0.18),transparent 55%),radial-gradient(ellipse 40% 40% at 50% 50%,rgba(26,37,64,0.8),transparent 100%);z-index:0;}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:48px 48px;z-index:0;}

.scene{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:20px;}

.brand{display:flex;align-items:center;gap:14px;margin-bottom:40px;animation:fadeUp 0.6s ease both;}
.brand-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--blue2),var(--blue));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(59,111,212,0.35);}
.brand-icon svg{width:26px;height:26px;stroke:#fff;fill:none;}
.brand-text{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#fff;}
.brand-text span{color:var(--blue2);}

.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 36px 32px;backdrop-filter:blur(16px);animation:fadeUp 0.6s 0.1s ease both;box-shadow:0 32px 64px rgba(0,0,0,0.35);}
.card-title{font-size:18px;font-weight:500;color:var(--silver);margin-bottom:28px;letter-spacing:0.1px;}

.field{position:relative;margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.field-wrap{position:relative;}
.field-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex;align-items:center;}
.field-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.field input{width:100%;height:48px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;padding:0 16px 0 42px;font-family:'DM Sans',sans-serif;font-size:16px;color:#fff;transition:border-color 0.2s,background 0.2s;outline:none;-webkit-appearance:none;}
.field input::placeholder{color:rgba(255,255,255,0.25);}
.field input:focus{border-color:var(--blue2);background:rgba(82,133,232,0.08);}

.error-msg{display:none;font-size:12px;color:var(--error);margin-top:-8px;margin-bottom:12px;padding-left:4px;}
.error-msg.show{display:block;}

.btn{width:100%;height:50px;margin-top:24px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;letter-spacing:0.2px;cursor:pointer;transition:opacity 0.2s,transform 0.15s;box-shadow:0 8px 24px rgba(59,111,212,0.4);display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent;}
.btn:hover{opacity:0.9;transform:translateY(-1px);}
.btn:active{transform:translateY(0);opacity:0.85;}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

.spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;}
.btn.loading .spinner{display:block;}
.btn.loading .btn-text{display:none;}

.divider{height:1px;background:var(--border);margin:24px 0 20px;}
.footer-note{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:420px){
  .brand{margin-bottom:28px;}
  .brand-text{font-size:22px;}
  .brand-icon{width:40px;height:40px;border-radius:12px;}
  .brand-icon svg{width:22px;height:22px;}
  .card{padding:28px 22px 26px;border-radius:16px;}
  .card-title{font-size:16px;margin-bottom:22px;}
}
</style>
</head>
<body>
<div class="scene">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <span class="brand-text">Merch<span>Tech</span></span>
  </div>

  <div class="card">
    <p class="card-title">Acesse sua conta</p>

    <div class="field">
      <label>Usuário</label>
      <div class="field-wrap">
        <span class="field-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <input id="username" type="text" placeholder="seu.usuario" autocomplete="username">
      </div>
    </div>

    <div class="field">
      <label>Senha</label>
      <div class="field-wrap">
        <span class="field-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>

    <p class="error-msg" id="error-msg">Usuário ou senha inválidos.</p>

    <button class="btn" id="btn-login" onclick="fazerLogin()">
      <div class="spinner"></div>
      <span class="btn-text">Entrar</span>
    </button>

    <div class="divider"></div>
    <p class="footer-note">Acesso restrito a promotores e supervisores cadastrados.</p>
  </div>
</div>

<script>
  document.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });

  async function fazerLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btn-login');
    const errMsg   = document.getElementById('error-msg');

    if (!username || !password) {
      errMsg.textContent = 'Preencha usuário e senha.';
      errMsg.classList.add('show');
      return;
    }

    btn.classList.add('loading');
    btn.disabled = true;
    errMsg.classList.remove('show');

    try {
      const resp = await fetch('/MerchTech/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, senha: password })
      });

      if (!resp.ok) throw new Error('Credenciais inválidas');

      const data = await resp.json();
      sessionStorage.setItem('usuario', JSON.stringify(data));

      if (data.role === 'supervisor') {
        window.location.href = 'supervisor/supervisor.html';
      } else {
        window.location.href = 'promotor/promotor.html';
      }

    } catch (err) {
      errMsg.textContent = 'Usuário ou senha inválidos.';
      errMsg.classList.add('show');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
